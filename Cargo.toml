[package]
name = "thecargo"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
description = "Shared building blocks of the TheCargo Rust services: auth, errors, i18n, extraction, events, ClickHouse, observability"
repository = "https://github.com/TheCarGo-io/thecargo-lib-rs"
license = "UNLICENSED"
publish = false

[features]
default = ["clickhouse", "dashboard", "sentry", "rabbit"]
clickhouse = ["dep:clickhouse"]
dashboard = []
sentry = ["dep:sentry"]
rabbit = ["dep:lapin"]

[dependencies]
aes = "0.8"
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.23"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = "0.10.4"
clickhouse = { version = "0.15.3", default-features = false, features = ["lz4", "uuid", "chrono", "inserter"], optional = true }
futures-util = "0.3"
hmac = "0.12"
jsonwebtoken = { version = "11.1", default-features = false, features = ["rust_crypto"] }
lapin = { version = "4.12", default-features = false, features = ["default-runtime"], optional = true }
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
percent-encoding = "2.3"
phonenumber = "0.3.10"
rand = "0.9"
redis = { version = "1.8", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
secrecy = "0.10.3"
sentry = { version = "0.49.3", default-features = false, features = [
    "backtrace",
    "contexts",
    "panic",
    "reqwest",
    "rustls-no-provider",
    "tracing",
], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip", "preserve_order"] }
regex = "1.11"
serde_html_form = "0.4"
serde_path_to_error = "0.1"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "postgres",
    "macros",
    "uuid",
    "chrono",
    "json",
] }
subtle = "2.6"
thiserror = "2.0.21"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "signal", "time", "net", "sync"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2"
utoipa = { version = "6", features = ["uuid", "chrono", "preserve_order", "preserve_path_order"] }
uuid = { version = "1.29", features = ["v4", "serde"] }
rusty-s3 = "0.10.2"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_lifetimes = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
clone_on_ref_ptr = "warn"
map_err_ignore = "warn"
unused_result_ok = "warn"
large_futures = "warn"
unused_async_trait_impl = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
